<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;display=swap");
      .brand {
        font-family: 'Cormorant Garamond', 'Playfair Display', 'Didot', 'Bodoni MT', 'Georgia', 'Times New Roman', serif;
        font-size: 310px;
        font-weight: 600;
        fill: #F9F6F0;
        letter-spacing: -5px;
      }
    </style>
  </defs>
  <!-- Rich Noir Background -->
  <rect width="512" height="512" fill="#1A1A1A" />
  
  <!-- Centered 'PY' monogram -->
  <text x="240" y="350" class="brand" text-anchor="middle">PY</text>

  <!-- Signature Lime Square Accent -->
  <rect x="425" y="320" width="26" height="26" fill="#CFE11C" />
</svg>
